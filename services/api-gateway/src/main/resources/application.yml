server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      # 브라우저 프론트(:3000) → 게이트웨이(:8080) 크로스 오리진 허용.
      # 없으면 preflight 단계에서 전부 막혀 프론트가 아무 API 도 못 부른다.
      # 토큰을 Authorization 헤더로 보내므로 쿠키(allow-credentials)는 필요 없다.
      globalcors:
        add-to-simple-url-handler-mapping: true   # 라우트에 안 걸리는 요청의 preflight 도 처리
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:[*]"
              - "http://127.0.0.1:[*]"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            exposedHeaders: [X-Trace-Id]
            maxAge: 3600
      routes:
        # ── user-service ─────────────────────────────────────────────────────────
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/users/**
          # 회원가입·로그인은 JWT 필터 없이 통과 (필터 내부에서 permit 처리)
          filters:
            - JwtAuthentication

        - id: profile-service
          uri: lb://profile-service
          predicates:
            # 콤마로 나열해야 OR. 줄을 나누면 predicate 가 AND 되어 아무 것도 매칭 안 됨.
            - Path=/api/profiles/**,/api/tags/**
          filters:
            - JwtAuthentication

        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/api/channels/**
          filters:
            - JwtAuthentication

        - id: matching-service
          uri: lb://matching-service
          predicates:
            - Path=/api/likes/**,/api/matches/**
          filters:
            - JwtAuthentication
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/feed/**
          filters:
            - JwtAuthentication
        - id: connection-service
          uri: lb:ws://connection-service
          predicates:
            - Path=/ws/**
          filters:
            - JwtAuthentication

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:social-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

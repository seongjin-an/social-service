server:
  port: ${SERVER_PORT:8086}          # 8085까지 썼으니 8086
spring:
  application:
    name: matching-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:23306/social?serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:dev_user}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false


social:
  kafka:
    topics:
      like-relay: like-relay          # 직접 발행(판정 전 단계 — outbox 미경유)
      match-created: match-created    # outbox → Debezium → message-service
      match-fanout: match-fanout      # outbox → Debezium → fanout-delivery-service
      match-unmatched: match-unmatched # outbox → Debezium → message-service(채널 CLOSED)
    listeners:
      # pair(min:max) 키로 발행되므로 partitions == concurrency 여야 쌍별 직렬성이 보장된다.
      like-relay:
        topic: like-relay
        group: matching-like-relay-group
        concurrency: 3
      channel-created:
        topic: channel-created
        group: matching-channel-created-group
        concurrency: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
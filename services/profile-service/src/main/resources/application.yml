server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: profile-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:23306/social}
    username: ${DATASOURCE_USERNAME:dev_user}
    password: ${DATASOURCE_PASSWORD:dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 기본값 10 으로는 부족했다. 없는 태그를 만들 때만 별도 트랜잭션(TagCreator)이 붙어서
      # 그 순간 요청 하나가 커넥션을 두 개 쓴다. 빈 DB 에 시딩하듯 전 요청이 그 경로를 타면
      # 동시 20 정도에서 풀이 말라 30초 타임아웃이 났다.
      # MySQL max_connections 는 151 이고 DB 붙는 서비스가 4개라 30 은 아직 여유가 있다.
      maximum-pool-size: ${DB_POOL_SIZE:30}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}       # 파일 1장 최대
      max-request-size: ${MAX_REQUEST_SIZE:30MB} # 멀티 업로드 전체 최대

# 프로필 이미지 저장 (데모: 로컬 디스크. 운영은 MinIO/S3 로 교체)
app:
  image:
    base-dir: ${IMAGE_BASE_DIR:./uploads}                       # 실제 파일 저장 위치
    public-base-url: ${IMAGE_PUBLIC_BASE_URL:http://localhost:8085/files} # imageUrl prefix (WebConfig 가 서빙)
geo:
  key: "geo:users"
  duration: 30

# 관심사 태그 Redis SET (P2 SINTERCARD 캐시). 원본은 DB profile_tag → 파생 캐시라 TTL 로 관리.
# ⚠️ TTL 만료로 사라진 후보 집합은 조회 측(P2)에서 rebuild-on-miss(profile_tag 재적재)로 복구해야 한다.
tags:
  key-prefix: "tags:"
  ttl: ${TAGS_TTL:30d}   # SET 만료. Spring Duration 표기(30d, 12h, 30m ...)

# 프로필 카드 캐시 profile:card:{userId} (matching F-M4/F-M6 가 MGET 으로 읽음).
# 키 접두사는 공용 상수 KeyPrefix.PROFILE_CARD — 읽는 쪽(matching)과 어긋나면 안 되므로 설정으로 빼지 않는다.
profile:
  card:
    ttl: ${PROFILE_CARD_TTL:30d}
  # 추천 선호값 캐시 profile:pref:{userId} (recommendation F2-1 이 본인 것 1건만 GET).
  pref:
    ttl: ${PROFILE_PREF_TTL:30d}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
